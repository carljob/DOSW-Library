spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

security:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiration-millis: 86400000

server:
  ssl:
    enabled: false

